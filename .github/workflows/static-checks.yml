name: static-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # This is the documented Live-USB userspace target. Pinning it prevents a
    # future ubuntu-latest migration from hiding a util-linux compatibility bug.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release publication checks
        run: python3 tools/validate_repo.py --release
      - name: Release checksum manifest
        run: python3 tools/generate_sha256s.py --check
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find linux tools -type f -name '*.sh' -print0 | sort -z)
      - name: Kernel-log runtime contract
        run: bash tools/test_dmesg_capture.sh
      - name: Exact-wrapper re-exec contract
        run: bash tools/test_exact_wrapper_reexec.sh
      - name: Kernel-error filter contract
        run: bash tools/test_kernel_error_filter.sh
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
