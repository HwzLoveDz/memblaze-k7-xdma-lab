<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1280"
  height="720"
  viewBox="0 0 1280 720"
  role="img"
  aria-labelledby="title desc">
  <title id="title">实测连接拓扑</title>
  <desc id="desc">ASUS ROG Flow Z13 通过 Thunderbolt 4、UGREEN M.2 外接盒和 M.2 转 PCIe x4 转接板连接 Memblaze XC7K325T 主板；外接盒经转接板提供 3.3 伏，USB-C PD 经诱骗模块提供 12 伏，主机通过 USB 连接 Platform Cable USB，再由调试器向主板提供 JTAG。</desc>

  <defs>
    <filter id="card-shadow" x="-10%" y="-12%" width="120%" height="132%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dy="2" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto-start-reverse">
      <path d="M 1,1 L 9,5 L 1,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-3v3" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M 1,1 L 9,5 L 1,9 Z" fill="#2e7d66"/>
    </marker>
    <marker id="arrow-12v" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M 1,1 L 9,5 L 1,9 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-jtag" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M 1,1 L 9,5 L 1,9 Z" fill="#7c3aed"/>
    </marker>

    <style>
      .canvas { fill: #f8fafc; }
      .eyebrow { font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1.6px; fill: #64748b; }
      .page-title { font: 700 30px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#card-shadow); }
      .card-accent { fill: #2563eb; }
      .card-kicker { font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0.8px; fill: #64748b; }
      .card-title { font: 700 19px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card-body { font: 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .port-label { font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .rail-label { font: 600 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .legend { font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .data { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power-3v3 { fill: none; stroke: #2e7d66; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .power-12v { fill: none; stroke: #c2410c; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .usb { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .jtag { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .mini-card { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .mini-title { font: 700 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .mini-body { font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Background" id="background">
    <rect class="canvas" width="1280" height="720"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Header" id="header">
    <text class="eyebrow" x="52" y="40">MEMBLAZE K7 XDMA LAB</text>
    <text class="page-title" x="52" y="76">实测连接拓扑</text>

    <g transform="translate(690,35)">
      <line x1="0" y1="6" x2="28" y2="6" class="data"/>
      <text class="legend" x="37" y="11">PCIe 数据</text>
      <line x1="124" y1="6" x2="152" y2="6" class="power-3v3"/>
      <text class="legend" x="161" y="11">3.3 V</text>
      <line x1="230" y1="6" x2="258" y2="6" class="power-12v"/>
      <text class="legend" x="267" y="11">12 V</text>
      <line x1="330" y1="6" x2="358" y2="6" class="usb"/>
      <text class="legend" x="367" y="11">USB</text>
      <line x1="420" y1="6" x2="448" y2="6" class="jtag"/>
      <text class="legend" x="457" y="11">JTAG</text>
    </g>
    <line x1="52" y1="104" x2="1228" y2="104" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Connections" id="connections">
    <!-- Main PCIe path -->
    <path class="data" d="M 300,234 H 350" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
    <path class="data" d="M 600,234 H 650" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
    <path class="data" d="M 900,234 H 950" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>

    <!-- 3.3 V enters and leaves through the M.2-to-PCIe adapter -->
    <path class="power-3v3" d="M 480,322 V 382 H 694 V 322" marker-end="url(#arrow-3v3)"/>
    <path class="power-3v3" d="M 856,322 V 382 H 1068 V 322" marker-end="url(#arrow-3v3)"/>

    <!-- Auxiliary 12 V ends at the adapter's dedicated input -->
    <path class="power-12v" d="M 600,503 H 650" marker-end="url(#arrow-12v)"/>
    <path class="power-12v" d="M 778,450 V 322" marker-end="url(#arrow-12v)"/>
    <path class="power-12v" d="M 900,298 H 950" marker-end="url(#arrow-12v)"/>

    <!-- The host controls the Platform Cable over USB -->
    <path class="usb" d="M 168,322 V 560"/>

    <!-- JTAG stays on its own lower route -->
    <path class="jtag" d="M 286,615 H 1162 V 322" marker-end="url(#arrow-jtag)"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Nodes" id="nodes">
    <!-- Host -->
    <g id="host-card">
      <rect class="card" x="50" y="146" width="250" height="176" rx="14"/>
      <rect class="card-accent" x="50" y="146" width="250" height="5" rx="2.5"/>
      <text class="card-kicker" x="72" y="178">HOST</text>
      <text class="card-title" x="72" y="211">ASUS ROG Flow Z13</text>
      <text class="card-body" x="72" y="253">Thunderbolt 4 主机</text>
      <text class="card-body" x="72" y="279">运行 XDMA 用户态测试</text>
    </g>

    <!-- M.2 enclosure -->
    <g id="enclosure-card">
      <rect class="card" x="350" y="146" width="250" height="176" rx="14"/>
      <rect class="card-accent" x="350" y="146" width="250" height="5" rx="2.5"/>
      <text class="card-kicker" x="372" y="178">PCIe BRIDGE</text>
      <text class="card-title" x="372" y="211">UGREEN M.2 外接盒</text>
      <text class="card-body" x="372" y="253">USB4 / M.2 M-Key</text>
      <text class="card-body" x="372" y="279">PCIe ×4 + 3.3 V 输出</text>
    </g>

    <!-- Adapter -->
    <g id="adapter-card">
      <rect class="card" x="650" y="146" width="250" height="176" rx="14"/>
      <rect class="card-accent" x="650" y="146" width="250" height="5" rx="2.5"/>
      <text class="card-kicker" x="672" y="178">ADAPTER</text>
      <text class="card-title" x="672" y="211">M.2 → PCIe ×4 转接板</text>
      <text class="card-body" x="672" y="253">PCIe 信号 + 3.3 V</text>
      <text class="card-body" x="672" y="279">辅助 12 V 输入</text>
    </g>

    <!-- FPGA board -->
    <g id="fpga-card">
      <rect class="card" x="950" y="146" width="280" height="176" rx="14"/>
      <rect class="card-accent" x="950" y="146" width="280" height="5" rx="2.5"/>
      <text class="card-kicker" x="972" y="178">FPGA ENDPOINT</text>
      <text class="card-title" x="972" y="211">Memblaze XC7K325T</text>
      <text class="card-body" x="972" y="253">XDMA PCIe Endpoint</text>
      <text class="card-body" x="972" y="279">4 GiB DDR3</text>
    </g>

    <!-- Auxiliary devices -->
    <g id="pd-source">
      <rect class="mini-card" x="390" y="450" width="210" height="106" rx="12"/>
      <rect x="390" y="450" width="5" height="106" rx="2.5" fill="#c2410c"/>
      <text class="mini-title" x="414" y="487">USB-C PD 电源</text>
      <text class="mini-body" x="414" y="518">协商输出 12 V</text>
    </g>

    <g id="pd-trigger">
      <rect class="mini-card" x="650" y="450" width="250" height="106" rx="12"/>
      <rect x="650" y="450" width="5" height="106" rx="2.5" fill="#c2410c"/>
      <text class="mini-title" x="674" y="487">PD 诱骗模块</text>
      <text class="mini-body" x="674" y="518">12 V → 转接板辅助供电</text>
    </g>

    <g id="jtag-cable">
      <rect class="mini-card" x="50" y="560" width="236" height="110" rx="12"/>
      <rect x="50" y="560" width="5" height="110" rx="2.5" fill="#7c3aed"/>
      <text class="mini-title" x="74" y="598">Platform Cable USB</text>
      <text class="mini-body" x="74" y="628">DLC9LP / USB → JTAG</text>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Labels" id="labels">
    <text class="port-label" x="325" y="220" text-anchor="middle">TB4</text>
    <text class="port-label" x="625" y="220" text-anchor="middle">M.2</text>
    <text class="port-label" x="925" y="220" text-anchor="middle">PCIe</text>
    <text class="port-label" x="925" y="288" text-anchor="middle" style="fill:#c2410c">12 V</text>

    <text class="rail-label" x="536" y="371" fill="#2e7d66">M.2 3.3 V</text>
    <text class="rail-label" x="914" y="371" fill="#2e7d66">3.3 V</text>
    <text class="rail-label" x="828" y="420" fill="#c2410c">辅助 12 V</text>
    <text class="rail-label" x="184" y="442" fill="#64748b">USB</text>
    <text class="rail-label" x="1010" y="641" fill="#7c3aed">JTAG</text>
  </g>
</svg>
